name: Build Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Plugins
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew makePlugins --no-daemon

      - name: Commit & Push build outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          cp build/*.cs3 . || true
          git add *.cs3
          git commit -m "Auto-build plugin updates" || true
          git push
